name: EOS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package/test dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then python3 -m pip install -e .; fi
          python3 -m pip install pytest

      - name: Classify changed files
        run: |
          set -euo pipefail
          changed_files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref }}"
            git fetch origin "${base_ref}" --depth=1
            changed_files="$(git diff --name-only "origin/${base_ref}...HEAD")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          fi

          changed_code=true
          docs_only=true
          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            case "${path}" in
              src/*|tests/*|scripts/*|.github/*)
                changed_code=true
                docs_only=false
                break
                ;;
              docs/*|README.md|AGENTS.md)
                ;;
              *)
                changed_code=true
                docs_only=false
                break
                ;;
            esac
          done <<EOF
          ${changed_files}
          EOF

          if [ -n "${changed_files}" ] && [ "${docs_only}" = "true" ]; then
            changed_code=false
          fi

          changed_file_count=0
          if [ -n "${changed_files}" ]; then
            changed_file_count="$(printf '%s\n' "${changed_files}" | wc -l | tr -d ' ')"
          fi
          echo "Changed file count: ${changed_file_count}"
          echo "PR_CHANGED_CODE=${changed_code}" | tee -a "${GITHUB_ENV}"

      - name: Check whitespace
        run: git diff --check

      - name: Secret scan
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import sys
          from pathlib import Path

          patterns = (
              re.compile(r"\bgh[opsu]_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bsk-[A-Za-z0-9_-]{24,}\b"),
              re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{20,}\b"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |)?PRIVATE KEY-----"),
          )
          hits: list[str] = []
          for raw_path in subprocess.check_output(["git", "ls-files"], text=True).splitlines():
              path = Path(raw_path)
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              if any(pattern.search(text) for pattern in patterns):
                  hits.append(raw_path)
          if hits:
              print("Secret scan hit in tracked files:")
              for path in hits:
                  print(f"- {path}")
              sys.exit(1)
          print("Secret scan passed.")
          PY

      - name: Run tests
        run: bash scripts/run_eos_tests.sh

      - name: Run privacy-safe smoke checks
        run: bash scripts/run_eos_smoke.sh
